name: lab-outbox-log-tailing

# The WAL relay connects exclusively to the Order Service database.
x-order-app: &order-app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://demo:demo@postgres_order:5432/orders
    AMQP_URL: amqp://student:student@rabbitmq:5672/%2F
    REPLICATION_DSN: "dbname=orders user=demo password=demo host=postgres_order port=5432"
    REPLICATION_SLOT: outbox_slot

services:
  postgres_order:
    build: ./db
    # PostgreSQL 16.15+ requires explicit allowlisting of third-party logical
    # output plugins. wal2json is installed in ./db/Dockerfile.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - output_plugin_libraries=pgoutput,test_decoding,wal2json
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: orders
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d orders"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Audit does NOT connect to the Order PostgreSQL instance or WAL slot.
  postgres_audit:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: audit
    volumes:
      - postgres_audit_data:/var/lib/postgresql/data
      - ./db/002_audit_schema.sql:/docker-entrypoint-initdb.d/002_audit_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d audit"]
      interval: 3s
      timeout: 3s
      retries: 30

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres_order
    ports:
      - "8082:8080"
    depends_on:
      postgres_order:
        condition: service_healthy
      postgres_audit:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: student
      RABBITMQ_DEFAULT_PASS: student
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  slot-init:
    <<: *order-app
    command: python -m app.log_tailing init-slot
    restart: "no"
    depends_on:
      postgres_order:
        condition: service_healthy

  topology:
    <<: *order-app
    command: python -m app.messaging topology
    restart: "no"
    depends_on:
      rabbitmq:
        condition: service_healthy

  api:
    <<: *order-app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8004:8000"
    depends_on:
      slot-init:
        condition: service_completed_successfully

  audit:
    build: .
    command: python -m app.messaging consumer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://demo:demo@postgres_audit:5432/audit
      AMQP_URL: amqp://student:student@rabbitmq:5672/%2F
    depends_on:
      postgres_audit:
        condition: service_healthy
      topology:
        condition: service_completed_successfully

  relay:
    <<: *order-app
    command: python -m app.log_tailing relay
    restart: unless-stopped
    depends_on:
      slot-init:
        condition: service_completed_successfully
      topology:
        condition: service_completed_successfully

volumes:
  postgres_order_data:
  postgres_audit_data:
  rabbitmq_data:

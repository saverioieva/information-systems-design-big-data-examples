name: lab-outbox-log-tailing

x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://demo:demo@postgres:5432/orders
    AMQP_URL: amqp://student:student@rabbitmq:5672/%2F
    REPLICATION_DSN: "dbname=orders user=demo password=demo host=postgres port=5432"
    REPLICATION_SLOT: outbox_slot

services:
  postgres:
    build: ./db
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: orders
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d orders"]
      interval: 3s
      timeout: 3s
      retries: 30

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: student
      RABBITMQ_DEFAULT_PASS: student
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  slot-init:
    <<: *app
    command: python -m app.log_tailing init-slot
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  topology:
    <<: *app
    command: python -m app.messaging topology
    restart: "no"
    depends_on:
      rabbitmq:
        condition: service_healthy

  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8004:8000"
    depends_on:
      slot-init:
        condition: service_completed_successfully

  audit:
    <<: *app
    command: python -m app.messaging consumer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      topology:
        condition: service_completed_successfully

  relay:
    <<: *app
    command: python -m app.log_tailing relay
    restart: unless-stopped
    depends_on:
      slot-init:
        condition: service_completed_successfully
      topology:
        condition: service_completed_successfully

volumes:
  pgdata:
  rabbitmq_data:

name: lab-transactional-outbox
x-app: &app
  build: .
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://demo:demo@postgres:5432/orders
    AMQP_URL: amqp://student:student@rabbitmq:5672/%2F
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: orders
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d orders"]
      interval: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: student
      RABBITMQ_DEFAULT_PASS: student
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
  relay:
    <<: *app
    command: python -c 'from app.main import relay; relay()'
    restart: on-failure
  audit:
    <<: *app
    command: python -c 'from app.main import consumer; consumer()'
    restart: on-failure
volumes:
  postgres_data:
  rabbitmq_data:

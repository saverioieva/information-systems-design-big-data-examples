name: lab-transactional-outbox

# Order API and polling relay share only the Order Service database.
x-order-app: &order-app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://demo:demo@postgres_order:5432/orders
    AMQP_URL: amqp://student:student@rabbitmq:5672/%2F
  depends_on:
    postgres_order:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres_order:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: orders
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d orders"]
      interval: 3s
      retries: 30
    volumes:
      - postgres_order_data:/var/lib/postgresql/data

  # The Audit Consumer owns its own PostgreSQL instance and volume.
  postgres_audit:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: audit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d audit"]
      interval: 3s
      retries: 30
    volumes:
      - postgres_audit_data:/var/lib/postgresql/data

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres_order
    ports:
      - "8082:8080"
    depends_on:
      postgres_order:
        condition: service_healthy
      postgres_audit:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: student
      RABBITMQ_DEFAULT_PASS: student
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  api:
    <<: *order-app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  relay:
    <<: *order-app
    command: python -c 'from app.main import relay; relay()'
    restart: on-failure

  audit:
    build: .
    command: python -m app.adapters.inbound.audit_consumer
    environment:
      DATABASE_URL: postgresql+psycopg://demo:demo@postgres_audit:5432/audit
      AMQP_URL: amqp://student:student@rabbitmq:5672/%2F
    depends_on:
      postgres_audit:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_order_data:
  postgres_audit_data:
  rabbitmq_data:

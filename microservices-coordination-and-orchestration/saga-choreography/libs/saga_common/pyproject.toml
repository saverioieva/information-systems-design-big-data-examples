[project]
name = "saga-common"
version = "0.1.0"
description = "Shared helpers for Saga choreography demo (AMQP + SQLAlchemy + Outbox)."
requires-python = ">=3.11"
dependencies = [
  "pika>=1.3,<2.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg2-binary>=2.9,<3.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

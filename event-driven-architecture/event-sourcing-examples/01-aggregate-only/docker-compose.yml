services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ftgo
      POSTGRES_USER: ftgo
      POSTGRES_PASSWORD: ftgo
    ports: ["55431:5432"]
    volumes: ["orders_state_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftgo -d ftgo"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ftgo
      DB_USER: ftgo
      DB_PASSWORD: ftgo
    ports: ["8101:8000"]
  adminer:
    image: adminer:4
    depends_on: [db]
    ports: ["8181:8080"]
volumes:
  orders_state_db:

events {}

http {
    # Docker embedded DNS server for containers
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream app {
        # 'resolve' forces nginx to re-resolve the service name periodically,
        zone app_upstream 64k;   # <-- REQUIRED when using "resolve"
        # so scaling 'web' updates the load-balancing pool.
        server web:80 resolve;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app;
        }
    }
}

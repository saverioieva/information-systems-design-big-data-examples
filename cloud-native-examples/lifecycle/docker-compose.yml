services:
  # "App" service: built locally from Dockerfile.
  # We scale this service to demonstrate horizontal scaling and container replacement.
  web:
    build: .
    image: lifecycle-demo-app:latest
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Reverse proxy / load balancer
  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      web:
        condition: service_healthy

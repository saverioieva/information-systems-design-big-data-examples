events {}

http {
    upstream app {
        # Default: 90% stable, 10% canary
        server stable:5000 weight=9;
        server canary:5000 weight=1;

        # Rollback to stable only:
        # server stable:5000;

        # Promote canary to 100%:
        # server canary:5000;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://app;
        }
    }
}

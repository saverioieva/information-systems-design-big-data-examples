services:
  stable:
    build: .
    environment:
      - VERSION=STABLE
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
  canary:
    build: .
    environment:
      - VERSION=CANARY
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      stable:
        condition: service_healthy
      canary:
        condition: service_healthy

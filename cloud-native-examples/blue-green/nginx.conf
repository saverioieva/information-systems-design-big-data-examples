events {}

http {
    upstream app {
        # Start with Blue (production)
        server blue:5000;

        # To switch to Green, comment Blue above and uncomment Green below,
        # then reload Nginx: `docker compose exec proxy nginx -s reload`
        # server green:5000;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://app;
        }
    }
}

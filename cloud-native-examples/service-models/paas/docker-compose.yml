services:
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./app:/app:ro
    command: ["sh", "-c", "pip install --no-cache-dir -r requirements.txt && python app.py"]
    environment:
      PORT: "5000"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8080:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

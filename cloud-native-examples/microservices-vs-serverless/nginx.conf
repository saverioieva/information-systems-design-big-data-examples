worker_processes  1;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  upstream microservice_upstream { server microservice:5000; }
  upstream function_upstream { server function:8080; }

  server {
    listen 80;
    server_name _;

    location /healthz {
      return 200 "ok\n";
    }

    # Microservice (typical always-on service)
    location /microservice/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      rewrite ^/microservice/(.*)$ /$1 break;
      proxy_pass http://microservice_upstream;
    }

    # Function (event-driven "serverless-like" handler)
    location /function/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      rewrite ^/function/(.*)$ /$1 break;
      proxy_pass http://function_upstream;
    }

    # Landing page
    location / {
      default_type text/plain;
      return 200 "Try:\n- GET  /microservice/hello\n- POST /microservice/sum  (JSON: {\"a\":1,\"b\":2})\n- POST /function/        (body: plain text)\n";
    }
  }
}

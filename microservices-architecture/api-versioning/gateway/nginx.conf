# Media-type versioning keeps the public URI stable and selects the major
# representation through HTTP content negotiation.
map $http_accept $api_major_prefix {
    default "";
    ~*application/vnd\.ftgo\.order\.v1\+json /v1;
    ~*application/vnd\.ftgo\.order\.v2\+json /v2;
}

server {
    listen 80;
    server_name _;

    location = / {
        default_type application/json;
        return 200 '{"example":"FTGO API versioning","uriVersioning":{"v1":"/v1/orders/123","v2":"/v2/orders/123"},"mediaTypeVersioning":{"uri":"/orders/123","v1":"application/vnd.ftgo.order.v1+json","v2":"application/vnd.ftgo.order.v2+json"}}';
    }

    # Alternative 1: URI versioning.
    location /v1/ {
        proxy_pass http://order-v1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v2/ {
        proxy_pass http://order-v2:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Alternative 2: media-type versioning.
    # The client keeps /orders/{id} stable and selects the representation
    # through Accept. The rewrite is internal: the public URI does not change.
    location /orders/ {
        default_type application/json;

        if ($api_major_prefix = "") {
            return 406 '{"detail":"Unsupported or missing versioned Accept media type","supported":["application/vnd.ftgo.order.v1+json","application/vnd.ftgo.order.v2+json"]}';
        }

        rewrite ^/orders/(.*)$ $api_major_prefix/orders/$1 last;
    }
}

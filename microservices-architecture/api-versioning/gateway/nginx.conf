server {
    listen 80;
    server_name _;

    location = / {
        default_type application/json;
        return 200 '{"example":"FTGO API versioning","v1":"/v1/orders/123","v2":"/v2/orders/123"}';
    }

    location /v1/ {
        proxy_pass http://order-v1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v2/ {
        proxy_pass http://order-v2:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

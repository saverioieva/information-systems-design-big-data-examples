events {}

http {
    # Consul DNS is the service-discovery source used by Nginx.
    # Nginx 1.27.3+ can re-resolve upstream hostnames dynamically.
    resolver consul:8600 valid=2s ipv6=off;
    resolver_timeout 1s;

    upstream order_service {
        zone order_service 64k;
        server order-service.service.consul:8000 resolve;
    }

    server {
        listen 80;

        location = /router-health {
            default_type application/json;
            return 200 '{"status":"ok","router":"nginx"}\n';
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass http://order_service;
        }
    }
}

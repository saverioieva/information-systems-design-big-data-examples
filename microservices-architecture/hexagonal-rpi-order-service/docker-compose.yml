services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - order_db:/var/lib/postgresql/data

  order-service:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://orders:orders@postgres:5432/orders
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      SWAGGER_JSON: /spec/order-api.yaml
    volumes:
      - ./openapi:/spec:ro
    ports:
      - "8080:8080"

volumes:
  order_db:

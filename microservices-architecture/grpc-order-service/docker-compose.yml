services:
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      GRPC_PORT: "50051"
    ports:
      - "50051:50051"

  checkout-service:
    build:
      context: .
      dockerfile: checkout-service/Dockerfile
    environment:
      INVENTORY_GRPC_TARGET: inventory-service:50051
    depends_on:
      - inventory-service
    ports:
      - "8000:8000"

  grpc-client:
    build:
      context: .
      dockerfile: demo-clients/Dockerfile
    environment:
      INVENTORY_GRPC_TARGET: inventory-service:50051
    depends_on:
      - inventory-service
    profiles: ["tools"]
  grpc-sniffer:
    image: parrotsec/tshark:latest
    network_mode: "service:inventory-service"
    depends_on:
      - inventory-service
    cap_add:
      - NET_ADMIN
      - NET_RAW
    profiles: ["tools"]
    command:
      - -i
      - any
      - -f
      - tcp port 50051
      - -d
      - tcp.port==50051,http2
      - -Y
      - http2.type == 0
      - -V
      - -x

